<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Scriptura</title>

    <!--
      CSS custom property definitions for all 6 themes.
      The [data-theme] attribute on <html> is set by the inline script below
      BEFORE any JavaScript bundle loads, preventing a flash of the wrong theme.
    -->
    <style id="scriptura-themes">
      /* ── Parchment (default) ── */
      :root,
      [data-theme="parchment"] {
        --bg: #F6EFE2;
        --surface: #FBF6EC;
        --text-primary: #3B2A1E;
        --text-secondary: #6B5847;
        --accent: #8B5E34;
        --border: #E4D5BE;
      }
      /* ── Midnight ── */
      [data-theme="midnight"] {
        --bg: #1E1812;
        --surface: #2A221B;
        --text-primary: #EDE3D3;
        --text-secondary: #B8A793;
        --accent: #D9A15B;
        --border: #3A3025;
      }
      /* ── Daylight ── */
      [data-theme="daylight"] {
        --bg: #FAFAF8;
        --surface: #FFFFFF;
        --text-primary: #1A1A1A;
        --text-secondary: #5A5A5A;
        --accent: #2563EB;
        --border: #E0E0DE;
      }
      /* ── Sage ── */
      [data-theme="sage"] {
        --bg: #F1F3EC;
        --surface: #F8FAF5;
        --text-primary: #1E2418;
        --text-secondary: #4D5A47;
        --accent: #3A6B40;
        --border: #CDD6C4;
      }
      /* ── Forest ── */
      [data-theme="forest"] {
        --bg: #0D1914;
        --surface: #162820;
        --text-primary: #E2ECE6;
        --text-secondary: #9EB1A6;
        --accent: #34D399;
        --border: #264235;
      }
      /* ── Dark ── */
      [data-theme="dark"] {
        --bg: #0C0A09;
        --surface: #1C1917;
        --text-primary: #FAFAF9;
        --text-secondary: #A8A29E;
        --accent: #60A5FA;
        --border: #44403C;
      }
    </style>

    <!--
      No-flash theme bootstrap.
      Runs synchronously before paint. Reads localStorage (same key as AsyncStorage
      on web: @scriptura_theme + @scriptura_theme_chosen).
      Falls back to prefers-color-scheme if no explicit choice has been made.
    -->
    <script>
      (function () {
        var VALID = ['parchment','midnight','daylight','sage','forest','dark'];
        var BG_MAP = {
          parchment: '#F6EFE2',
          midnight:  '#1E1812',
          daylight:  '#FAFAF8',
          sage:      '#F1F3EC',
          forest:    '#0D1914',
          dark:      '#0C0A09',
        };

        function getTheme() {
          try {
            var chosen = localStorage.getItem('@scriptura_theme_chosen');
            if (chosen === 'true') {
              var saved = localStorage.getItem('@scriptura_theme');
              if (saved && VALID.indexOf(saved) !== -1) return saved;
            }
          } catch (e) {}
          // First visit: respect prefers-color-scheme
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              return 'midnight';
            }
          } catch (e) {}
          return 'parchment';
        }

        var theme = getTheme();
        document.documentElement.setAttribute('data-theme', theme);
        // Set body background synchronously to kill any white flash
        document.documentElement.style.backgroundColor = BG_MAP[theme] || '#F6EFE2';
      })();
    </script>

    <!-- Expo reset styles -->
    <style id="expo-reset">
      html, body {
        height: 100%;
        background-color: var(--bg, #F6EFE2);
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
